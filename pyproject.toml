[project]
name = "pyside-widgets"
version = "0.4.1"
description = "A collection of custom PySide6 widgets along with plugins for Qt Designer."
readme = "README.md"
authors = [
    { name = "devduck", email = "frederik.kraemer@dev-duck.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.12.0",
]

[project.optional-dependencies]
jupyter = [
    "qtconsole>=5.7.2",
]

[project.scripts]
demo = "pyside_widgets.examples.widget_gallery:main"
designer = "pyside_widgets.examples.designer:run"

[project.entry-points.pyinstaller40]
# Lets PyInstaller find the hook that bundles the SVG icons when an application using this package is frozen.
hook-dirs = "pyside_widgets.__pyinstaller:get_hook_dirs"

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "qtconsole>=5.7.2",
    "ruff>=0.17.1",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["src/pyside_widgets/__pyinstaller/hook-*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/pyside_widgets/__pyinstaller"]
pythonVersion = "3.14"
